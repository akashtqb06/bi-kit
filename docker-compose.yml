services:
  db:
    image: postgres:16-alpine
    container_name: bikit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bikit_prod}
      POSTGRES_INITDB_ARGS: --data-checksums
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=256MB"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-bikit_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Optional direct database access for host tools (e.g. TablePlus, DBeaver)
    # ports:
    #   - "127.0.0.1:5433:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bikit-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.production
    environment:
      HOSTNAME: "0.0.0.0"
      FINANCE_BACKEND: "db"
      FINANCE_FEATURES: ${FINANCE_FEATURES:-overview,transactions,accounts,setup,recurring,import}
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /app/.next/cache:mode=0755,uid=1001,gid=1001
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.get('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.setTimeout(4000, () => { req.destroy(); process.exit(1); });"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.scheduler
    container_name: bikit-scheduler
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET}
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: postgres:16-alpine
    container_name: bikit-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-bikit_prod}
      BACKUP_EXCLUDE_SCHEMAS: ${BACKUP_EXCLUDE_SCHEMAS:-store_*}
      BACKUP_SYNC_DIR: ${BACKUP_SYNC_DIR:-}
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
    volumes:
      - ./backups:/backups
      - app_data:/app_data:ro
      - ./docker/backup.sh:/usr/local/bin/backup.sh
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "apk add --no-cache tzdata bash rsync &&
      chmod +x /usr/local/bin/backup.sh &&
      echo '30 1 * * * /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1' > /etc/crontabs/root &&
      crond -f -l 2"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: caddy:2-alpine
    container_name: bikit-proxy
    profiles: ["lan"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LAN_HOSTNAME: ${LAN_HOSTNAME:-finance.local}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prod_postgres_data:
  app_data:
  caddy_data:
  caddy_config:
