<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.3" />

  <!-- Finance Shield / Vault Container -->
  <g filter="url(#shadow)">
    <!-- Upward Trend Chart Bars -->
    <rect x="120" y="280" width="48" height="110" rx="12" fill="url(#accentGrad)" opacity="0.8" />
    <rect x="190" y="220" width="48" height="170" rx="12" fill="url(#accentGrad)" opacity="0.9" />
    <rect x="260" y="160" width="48" height="230" rx="12" fill="url(#primaryGrad)" />
    <rect x="330" y="200" width="48" height="190" rx="12" fill="url(#primaryGrad)" opacity="0.9" />

    <!-- Rupee / Growth Symbol Dynamic Line -->
    <path d="M 120 270 Q 200 170 280 140 T 380 110" fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round" />
    <!-- Glowing Node at Chart Peak -->
    <circle cx="380" cy="110" r="14" fill="#6ee7b7" />
    <circle cx="380" cy="110" r="24" fill="#34d399" opacity="0.3" />
  </g>

  <!-- Subtle Currency Emblem (paise / rupee dot) -->
  <circle cx="256" cy="428" r="8" fill="#94a3b8" opacity="0.6" />
</svg>
