services:
  postgres:
    image: postgres:16
    container_name: bi-kit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bi_password_123!
      POSTGRES_DB: bikit_dev
    ports:
      - "5432:5432"
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bikit_dev"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: bi-kit-mysql
    environment:
      MYSQL_ROOT_PASSWORD: bi_root_password_123!
      MYSQL_DATABASE: bikit_dev
      MYSQL_USER: mysql
      MYSQL_PASSWORD: bi_password_123!
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=bi_root_password_123!"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bi-kit-mssql
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Bi_Strong_Password_123!"
    ports:
      - "1434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Bi_Strong_Password_123!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Bi_Strong_Password_123!' -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: bi-kit-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: bi_password_123!
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:

